[project]
name = "emc2labs"
version = "2026.05.12"
description = "Labs for the Early Mathematics Computational Cohort (EMC2) in the Department of Mathematics at Brigham Young University."
readme = "README.md"

# Google Colab version of Python
requires-python = "==3.12.13"
dependencies = [
    "furo>=2025.12.19",
    "imageio>=2.37.3",
    "ipython>=9.13.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "myst-nb>=1.4.0",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "sphinx>=9.1.0",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
    "sphinx-material>=0.0.36",
    "sphinx-togglebutton>=0.4.5",
]

[tool.ruff]
line-length = 79
